# RGB image (Gazebo -> ROS)
- ros_topic_name: "/nav_cam/rgb_image/image_raw"
  gz_topic_name: "/nav_cam/rgb_image/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# (Optional but recommended) CameraInfo
- ros_topic_name: "/nav_cam/rgb_image/camera_info"
  gz_topic_name: "/nav_cam/rgb_image/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

