# config/zed2_yaml
# Parameters for Stereolabs ZED2 camera
---
/**:
    ros__parameters:
        qos_overrides:
            # '/zed/zed_node/imu/data_raw':
            #     publisher:
            #         reliability: best_effort
            '/zed/zed_node/left_raw_gray/image_raw_gray':
                publisher:
                    reliability: best_effort
            '/zed/zed_node/right_raw_gray/image_raw_gray':
                publisher:
                    reliability: best_effort
                    
        general:            
            camera_model: 'zed2'
            camera_name: 'zed2' # overwritten by launch file
            grab_resolution: 'VGA' # The native camera grab resolution. 'HD2K', 'HD1080', 'HD720', 'VGA', 'AUTO'
            pub_resolution: 'NATIVE' # The resolution used for image and depth map publishing. 'NATIVE' to use the same `general.grab_resolution` - `CUSTOM` to apply the `general.pub_downscale_factor` downscale factory to reduce bandwidth in transmission
            pub_downscale_factor: 1.0 
            grab_frame_rate: 15 # ZED SDK internal grabbing rate
            pub_frame_rate: 15.0

        depth:
            min_depth: 0.3 # Min: 0.3, Max: 3.0
            max_depth: 10.0 # Max: 40.0
            depth_mode: 'NEURAL_LIGHT' # Matches the ZED SDK setting: 'NONE', 'PERFORMANCE', 'QUALITY', 'ULTRA', 'NEURAL', 'NEURAL_PLUS' - Note: if 'NONE' all the modules that requires depth extraction are 
            depth_stabilization: 0 # Forces positional tracking to start if major than 0 - Range: [0,100]
            
        pos_tracking:
            pos_tracking_enabled: false # True to enable positional tracking from start
            publish_tf: true # [overwritten by launch file options] publish `odom -> camera_link` TF
            publish_map_tf: true # [overwritten by launch file options] publish `map -> odom` TF

        mapping:
            mapping_enabled: false # True to enable mapping and fused point cloud pubblication
            resolution: 0.05 # maps resolution in meters [min: 0.01f - max: 0.2f]
            max_mapping_range: 5.0 # maximum depth range while mapping in meters (-1 for automatic calculation) [2.0, 20.0]
            fused_pointcloud_freq: 1.0 # frequency of the publishing of the fused colored point cloud

